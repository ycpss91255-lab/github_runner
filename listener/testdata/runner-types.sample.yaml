# Sample runner-type configuration for the scale-set listener (ADR-0001
# "Per-runner-type configuration"; #110/#113).
#
# Each entry under `runner_types` describes ONE homogeneous class of ephemeral
# runner and maps to exactly ONE GitHub scale set (scale sets are homogeneous).
# Adding a new runner type is a new entry here, NOT a code change.
#
# The Go listener is the AUTHORITATIVE parser (ADR-0003): it loads and validates
# this file, then passes only the per-job fields a provision needs (image,
# devices, runtime, build tool, Docker socket) across the shell-out boundary to
# the bash container provisioner. Bash never parses this file.
#
# Install it next to the listener's EnvironmentFile, e.g.:
#   sudo install -m 0644 deploy/runner-types.sample.yaml \
#     /etc/github-runner-listener/runner-types.yaml
#   sudo "${EDITOR:-vi}" /etc/github-runner-listener/runner-types.yaml
#
# WHAT WORKFLOWS TARGET -- read this before editing anything below.
#
#   A workflow's `runs-on` is matched against the scale set's LABELS.
#   The scale set NAME is only an identifier.
#
# `labels` is THE ROUTING KEY -- what runs-on matches. `scale_set` merely names
# the scale set the listener connects to. The two coincide only when the scale
# set was created with its name as its single label, which is what happens when
# a type declares no labels of its own -- and is exactly why the name LOOKS like
# the routing target when it is not. Getting this wrong produces no error at
# all: the job sits in `queued`. (The REST job status also stays `queued` after
# a job has been assigned to a scale set, so `queued` alone proves nothing.)
#
# The labels are fixed when the scale set is CREATED (`scaleset-admin create`),
# from this file. Whatever they end up being is written explicitly into both the
# scale set and this file, so this file always states the routing key -- and
# `scaleset-admin` prints the literal `runs-on:` line to paste into a workflow.
#
# Schema (per entry):
#   name              required  operator-facing id; unique across the file.
#   scale_set         required  the GitHub scale set this type binds to; unique
#                               (one type -> one scale set). An IDENTIFIER --
#                               NOT what runs-on matches.
#   runner_group      optional  GitHub runner group the scale set lives in;
#                               empty = Default. Names are unique only within a
#                               group, so (runner_group, scale_set) is the
#                               identity. High availability: give every host
#                               the SAME scale_set and labels in its OWN group
#                               (deploy/README.md). The group must exist.
#   labels            required  THE ROUTING KEY: the runs-on labels workflows
#                               target this type with. Used verbatim; the scale
#                               set name is never added to them. To make name
#                               and routing key coincide, set this to exactly
#                               the scale_set value.
#   image             required  per-job container image; pin by DIGEST (sha256)
#                               to avoid :latest drift.
#   devices           optional  host device nodes passed through (--device,
#                               never --privileged). Empty for plain CPU types.
#   runtime           optional  container runtime / hardware shim (e.g. nvidia;
#                               gvisor/kata later), passed to the engine as one
#                               `--runtime <value>`. Empty = engine default (no
#                               flag). Free text: it names a shim registered
#                               with the local engine, so a wrong value makes
#                               the run fail loudly rather than be ignored.
#   build_tool        optional  daemonless image builder (kaniko / buildkit).
#   docker_socket     optional  host Docker socket to bind-mount at the same
#                               path. ROOT-EQUIVALENT on the host. Default off.
#   concurrency       optional  worker-pool sizing. REACTIVE BY DEFAULT:
#                                 (omitted)             reactive live-admission --
#                                                       admit each job while every
#                                                       resource keeps >=10% free,
#                                                       so the count is derived,
#                                                       not configured (ADR-0005, #163)
#                                 reserve: N            reactive, keep N% free
#                                                       (upward-only, minimum 10)
#                                 mode: auto            size from detected GPU
#                                                       count (#113; reactive
#                                                       GPU/VRAM is #164)
#                               There is no fixed operator count.

runner_types:
  # --- First concrete type: GPU (#113) -------------------------------------
  # Auto concurrency = detected GPU count (the listener runs nvidia-smi -L and
  # sizes its worker pool to one slot per GPU). Devices are passed through
  # precisely (no --privileged); the baseline container hardening + the ADR-0011
  # approval gate keep unapproved untrusted code off this rootful device host.
  - name: gpu
    # Fleet pattern (doc/runbook/FLEET.md): every host serves a scale set
    # named after its type, in its own runner group, with identical labels,
    # so a job assigned to a stopped host is requeued to another one.
    scale_set: gpu
    # This host's runner group. Omitted = Default.
    # runner_group: ci-<host>
    labels: [self-hosted, linux, x64, gpu, cuda]
    # Self-built GPU image (#121): the CUDA/device stack layered on the SEC-5
    # base (images/runner-gpu.Dockerfile -> images/runner-base.Dockerfile, whose
    # runner tarball passed verify_runner_tarball before being baked in). It
    # ships the docker CLI with pinned Compose and Buildx plugins. This pins
    # the published ghcr.io/ycpss91255-lab/gpu-runner image by digest -- never
    # :latest; after each publish copy the new digest from the runner images
    # workflow's job summary. To use your own build, push it to your registry
    # and pin that digest instead.
    # actions-runner 2.338.2
    image: ghcr.io/ycpss91255-lab/gpu-runner@sha256:9d37990581dbf3ada886daeb1afca65e1482e0f6d70f83d2e3f9e499c41f933d
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
    runtime: nvidia
    # GPU jobs build and run containers on the host Docker daemon, so this type
    # sets no daemonless build_tool. Enabling the socket is ROOT-EQUIVALENT on
    # the host: enable only for trusted jobs (ADR-0011 approval gate).
    # docker_socket: /var/run/docker.sock
    concurrency:
      mode: auto

  # --- A second type, shown to prove "two types, no code change" (#112) -----
  # The CPU sample pins the published ghcr.io/ycpss91255-lab/runner-cpu image
  # by digest. It is the stock upstream actions-runner image plus the Docker
  # Compose and Buildx plugins (images/runner-cpu.Dockerfile). The runner
  # images workflow's job summary lists the digest of each publish.
  #
  # Under GitHub's 30-day cutoff, dispatch stops for runners with auto-update
  # off once a newer release has been available for more than 30 days. A stale
  # pin can show "Listening for Jobs" while jobs stay queued.
  # Bump the upstream digest in images/runner-cpu.Dockerfile, republish, then
  # update the sample digest, the version comments, and
  # RUNNER_VERSION_FALLBACK in lib/runner-release.sh together. test/bats/unit/runner_image_pin.bats
  # checks that they agree.
  - name: cpu
    scale_set: cpu
    # This host's runner group (high availability: same scale_set and labels
    # on every host, one group per host). Omitted = Default.
    # runner_group: ci-<host>
    labels: [self-hosted, linux, x64, cpu]
    # actions-runner 2.338.2
    image: ghcr.io/ycpss91255-lab/runner-cpu@sha256:9e622508b7a16bcc4805f3ace3cc6490935e2a4bddaf2ba43380bbcef7de024f
    # Enable only for trusted jobs that need the host Docker daemon.
    # docker_socket: /var/run/docker.sock
    # Reactive live-admission (ADR-0005, #163): the listener admits each job
    # while CPU and memory each keep at least reserve% free -- the concurrent
    # count is derived from live headroom, not pinned. Raise reserve to leave
    # more room for co-tenant work; omit the block entirely for the 10% default.
    concurrency:
      reserve: 10
